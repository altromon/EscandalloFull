# ==============================================================================
# AI-SDLC: GitLab CI/CD Pipeline Template
# ==============================================================================

stages:
  - validate
  - test
  - integrate

default:
  image: node:20
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

variables:
  PNPM_HOME: "$CI_PROJECT_DIR/.pnpm"

before_script:
  - corepack enable
  - corepack prepare pnpm@10 --activate
  - pnpm config set store-dir .pnpm-store
  - pnpm install --frozen-lockfile
  - pnpm approve-builds --all
  - pnpm run build

quality-gates:
  stage: validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.*/'
  script:
    - node packages/cli/bin/aisdlc.js check

test-and-verify:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.*/'
  script:
    - pnpm test
    - node packages/cli/bin/aisdlc.js verify all

sdd-canonical-integration:
  stage: integrate
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.*/ && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - node packages/cli/bin/aisdlc.js sdd integrate --auto || true
    - |
      git config user.name "gitlab-ci-bot"
      git config user.email "gitlab-ci-bot@noreply.gitlab.com"
      git add -A
      if ! git diff --cached --quiet; then
        git commit -m "chore(sdd): integrate changes into canonical baseline [skip ci]"
        git push "https://oauth2:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_COMMIT_BRANCH}"
      fi
