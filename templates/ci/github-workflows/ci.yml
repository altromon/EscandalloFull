name: CI - .NET Build, Test & AI-SDLC Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (.NET & SDLC Gates)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore

      - name: Run Automated Test Suites
        run: dotnet test --no-build --filter "FullyQualifiedName!~Browser" --verbosity normal

      - name: AI-SDLC Quality Gate & Full Verification
        run: npx --yes @aisdlc/cli verify --profile lite || true
